<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var stored = null
        try {
          stored = localStorage.getItem('app.lang')
        } catch (e) {
          stored = null
        }
        var normalizedStored = stored ? stored.toLowerCase() : ''
        var storedLang = normalizedStored.startsWith('ru')
          ? 'ru'
          : normalizedStored.startsWith('en')
            ? 'en'
            : null
        var navLang = (navigator.language || navigator.userLanguage || 'en')
          .toLowerCase()
        var resolved = storedLang
          ? storedLang
          : navLang.startsWith('ru')
            ? 'ru'
            : navLang.startsWith('en')
              ? 'en'
              : 'en'
        document.documentElement.lang = resolved
        document.documentElement.setAttribute('data-lang', resolved)
      })()
    </script>
